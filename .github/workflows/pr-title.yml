name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      # Types and scopes must match CONTRIBUTING.md.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            core
            ucum
            fhir-r4
            fhir-r5
            cli
            conformance
            model-gen
          requireScope: false
          subjectPattern: ^[^A-Z].*[^.]$
          subjectPatternError: >-
            The summary "{subject}" must start with a lowercase word and must not end with a period.
            See CONTRIBUTING.md.
      - name: Title is at most 72 characters
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          length=$(printf '%s' "$TITLE" | wc -m)
          if [ "$length" -gt 72 ]; then
            echo "::error::The PR title has $length characters; the limit is 72. See CONTRIBUTING.md."
            exit 1
          fi
