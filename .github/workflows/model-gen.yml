name: FHIR model regeneration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --check compares a fresh generation with the committed files and never writes. The second
      # command writes, so the diff proves the committed output is what the generator produces.
      - name: Verify pinned model regeneration
        run: |
          pnpm --filter @callis/model-gen generate --check
          pnpm --filter @callis/model-gen generate
          git diff --exit-code -- packages/fhir-r4/src packages/fhir-r5/src
      - name: Verify generator and both ModelProvider contracts
        run: pnpm test --project model-gen --project fhir-r4 --project fhir-r5
