name: FHIR model regeneration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/model-gen/**"
      - "packages/fhir-r4/**"
      - "packages/fhir-r5/**"
      - ".github/workflows/model-gen.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "tools/model-gen/**"
      - "packages/fhir-r4/**"
      - "packages/fhir-r5/**"
      - ".github/workflows/model-gen.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned model regeneration twice
        run: |
          pnpm --filter @callis/model-gen generate --check
          pnpm --filter @callis/model-gen generate --check
          git diff --exit-code -- packages/fhir-r4/src/model-data.ts packages/fhir-r5/src/model-data.ts
      - name: Verify generator and both ModelProvider contracts
        run: pnpm test --project model-gen --project fhir-r4 --project fhir-r5
