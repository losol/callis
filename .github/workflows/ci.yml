name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run for its old head. Every push to main gets a group of
# its own, so each commit on main is checked in full: a later merge neither cancels its run nor
# replaces it while it waits in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Everything CI checks, on the development Node version from .node-version.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      model_changed: ${{ steps.model-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect model regeneration changes
        id: model-changes
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        # A missing base (for example the first push) conservatively regenerates. The paths are
        # the generator, its committed output and the two workflows: the only inputs that change
        # the generated bytes. A hand-edited model therefore cannot skip regeneration, while an
        # engine-only PR does not depend on packages.fhir.org being reachable.
        run: |
          if [ "$IS_PULL_REQUEST" = true ]; then
            DIFF_BASE="$(git merge-base "$DIFF_BASE" "$DIFF_HEAD")" || DIFF_BASE=""
          fi
          if git cat-file -e "${DIFF_BASE}^{commit}" 2>/dev/null &&
             git diff --quiet "$DIFF_BASE" "$DIFF_HEAD" -- \
               tools/model-gen \
               packages/fhir-r4/src/provider.ts packages/fhir-r4/src/model-data.ts \
               packages/fhir-r5/src/provider.ts packages/fhir-r5/src/model-data.ts \
               .github/workflows/model-gen.yml .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Roadmap
        run: pnpm check:roadmap
      - name: Test with coverage
        run: pnpm coverage
      - name: Build
        run: pnpm build
      - name: Package checks
        run: pnpm check:packages

  # Tests on the oldest and newest supported Node versions; the job above covers the one in
  # .node-version. Lint, typecheck, build and package checks give the same result on every version,
  # so they only run in the job above.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Not the site (T0035): it tests the library, and a dependency of the site does not support
      # Node 26 yet, which engine-strict turns into an install error. The site has its own job.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "!@callis/site"
      - name: Test
        run: pnpm test

  # The HL7 FHIRPath test suite (T0022): fails on a baseline regression or on a baseline that is out
  # of date, warns about out-of-date reports, and adds a job summary. The JSON summary and every test
  # result are uploaded as an artifact. Blocking since T0023 converted the XML fixtures, so every
  # phase-1 test runs.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    # A looping engine must not hold the runner until the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run the HL7 test suite
        run: >-
          pnpm conformance --check
          --results conformance-results.json
          --summary conformance-summary.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            conformance-results.json
            conformance-summary.json
          if-no-files-found: ignore

  # The documentation site (T0035). It is built on pull requests only, so a change that breaks the
  # site fails its PR; deploy.yml builds it again on main. It reads the whole git history.
  site:
    name: Site build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test the site
        run: pnpm site:test
      - name: Build the site
        run: pnpm site:build
      # A build that produced an empty site, or only the fallback page, must not pass.
      - name: Check the build output
        working-directory: apps/site/build/client
        run: |
          test -f index.html
          test -f architecture/index.html
          test -f progress/index.html
          test -f search-index.json
          grep -q "Callis" index.html

  # Keep the expensive network regeneration path-filtered, while making a failed generated
  # output check fail the same aggregate result as tests and package checks.
  model-gen:
    needs: check
    # Only an explicit unchanged result skips regeneration; a missing output runs it.
    if: needs.check.outputs.model_changed != 'false'
    uses: ./.github/workflows/model-gen.yml

  # The one check that branch protection requires, so the jobs above can be renamed, added or split
  # (for example a new Node version in the matrix) without changing the repository settings. It
  # fails when any job it needs failed or was cancelled. A skipped job counts as passed, so a job
  # that only runs on pull requests can be listed here too. Add every new job to `needs`.
  result:
    name: CI result
    if: always()
    needs: [check, test, conformance, site, model-gen]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$RESULTS"
          if [ "$FAILED" = true ]; then
            echo "::error title=CI result::A required job failed or was cancelled."
            exit 1
          fi
