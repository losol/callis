name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything CI checks, on the development Node version from .node-version.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Roadmap
        run: pnpm check:roadmap
      - name: Test with coverage
        run: pnpm coverage
      - name: Build
        run: pnpm build
      - name: Package checks
        run: pnpm check:packages

  # Tests on the oldest and newest supported Node versions. Lint, typecheck, build and package
  # checks give the same result on every version, so they only run in the job above.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  # The HL7 FHIRPath test suite (T0022): fails on a baseline regression or on a baseline that is out
  # of date, warns about out-of-date reports, and adds a job summary. The JSON summary and every test
  # result are uploaded as an artifact. Non-blocking until T0023 converts the XML fixtures, so a
  # failure shows on the step but not on the job.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    # A looping engine must not hold the runner until the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run the HL7 test suite
        continue-on-error: true # TODO(T0023): make blocking
        run: >-
          pnpm conformance --check
          --results conformance-results.json
          --summary conformance-summary.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            conformance-results.json
            conformance-summary.json
          if-no-files-found: ignore

  # The documentation site (T0035). It is built on pull requests only, so a change that breaks the
  # site fails its PR; deploy.yml builds it again on main. It reads the whole git history.
  site:
    name: Site build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm site:build
      # A build that produced an empty site, or only the fallback page, must not pass.
      - name: Check the build output
        working-directory: apps/site/build/client
        run: |
          test -f index.html
          test -f architecture/index.html
          test -f progress/index.html
          test -f search-index.json
          grep -q "Callis" index.html
